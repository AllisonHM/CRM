{% extends "base.html" %}
{% block title %}Configuração Chatbot{% endblock %}
{% block content %}

<h1 class="section-title">Regras do Chatbot</h1>

<div class="card card-accent mb-4">
  <div class="card-body">
    <form method="POST" class="mb-0">
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <label for="palavra_chave" class="form-label">Palavra-chave</label>
          <input type="text" name="palavra_chave" id="palavra_chave" class="form-control" required>
        </div>
        <div class="col-12 col-md-6">
          <label for="resposta" class="form-label">Resposta</label>
          <textarea name="resposta" id="resposta" class="form-control" rows="2" required></textarea>
        </div>
        <div class="col-12 col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-success w-100">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<h2 class="mb-3">Regras cadastradas</h2>
<div class="table-responsive">
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Palavra-chave</th>
        <th>Resposta</th>
      </tr>
    </thead>
    <tbody>
      {% for regra in regras %}
      <tr>
        <td>{{ regra.palavra_chave }}</td>
        <td>{{ regra.resposta }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
